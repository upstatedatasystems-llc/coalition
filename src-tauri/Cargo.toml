[package]
name = "coalition"
version = "0.1.0"
description = "Local-first desktop control plane for governed AI-assisted software development"
authors = ["Upstate Data Systems LLC"]
edition = "2021"

[lib]
name = "coalition_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coalition"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
which = "7.0"
arboard = "3.4"

[dev-dependencies]
tempfile = "3.17"
